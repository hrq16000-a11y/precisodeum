    <style>
      /* Critical CSS: prevent FOUC, accelerate FCP, stabilize CLS */
      *,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
      body{margin:0;line-height:inherit;background-color:hsl(210 20% 98%);color:hsl(215 40% 12%)}
      #root{min-height:100vh;display:flex;flex-direction:column}

      /* Shell loader */
      @keyframes shellPulse{0%,100%{opacity:.6}50%{opacity:1}}
      @keyframes shellBar{0%{left:-40%}100%{left:100%}}

      /* Font-display swap fallback for system font stack */
      @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700 800;font-display:swap;src:local('Plus Jakarta Sans')}
      @font-face{font-family:'Inter';font-style:normal;font-weight:400 500;font-display:swap;src:local('Inter')}
    </style>

  <body>
    <div id="root">
      <!-- Static shell for instant FCP — hidden once React mounts -->
      <div id="app-shell" aria-hidden="true" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:hsl(210 20% 98%);padding:24px;text-align:center">
        <img src="/icons/icon-192.png" alt="" width="80" height="80" style="border-radius:16px;animation:shellPulse 1.5s ease-in-out infinite" />
        <div id="app-shell-bar" style="margin-top:24px;width:180px;height:4px;border-radius:4px;background:hsl(210 15% 90%);overflow:hidden;position:relative">
          <div style="position:absolute;inset:0;width:40%;border-radius:4px;background:hsl(25 95% 53%);animation:shellBar 1.2s ease-in-out infinite"></div>
        </div>
        <div id="app-shell-recovery" style="display:none;margin-top:32px;max-width:420px;font-family:'Inter',system-ui,sans-serif;color:hsl(215 40% 12%)">
          <h2 style="font-size:18px;font-weight:700;margin:0 0 8px">Demorou mais que o esperado</h2>
          <p id="app-shell-recovery-msg" style="font-size:14px;color:hsl(215 20% 40%);margin:0 0 16px">Verifique sua conexão e tente novamente. Se o problema persistir, limpe o cache do navegador.</p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button type="button" onclick="(function(){try{var u=new URL(location.href);u.searchParams.set('__fresh',Date.now());location.replace(u.toString())}catch(e){location.reload()}})()" style="background:hsl(25 95% 53%);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px">Tentar novamente</button>
            <button type="button" onclick="(async function(){try{if('caches'in window){var k=await caches.keys();await Promise.all(k.map(function(n){return caches.delete(n)}))}if('serviceWorker'in navigator){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}try{localStorage.clear()}catch(e){}}finally{location.replace('/?__fresh='+Date.now())}})()" style="background:transparent;color:hsl(215 40% 12%);border:1px solid hsl(210 15% 80%);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px">Limpar cache</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Safety timeout: if React doesn't mount in 10s, show recovery UI inside the shell.
      window.__appShellTimer = setTimeout(function(){
        var shell = document.getElementById('app-shell');
        var recovery = document.getElementById('app-shell-recovery');
        var bar = document.getElementById('app-shell-bar');
        if (shell && recovery && document.getElementById('root').children.length === 1) {
          if (bar) bar.style.display = 'none';
          recovery.style.display = 'block';
        }
      }, 10000);
      window.addEventListener('error', function(e){
        var msg = document.getElementById('app-shell-recovery-msg');
        if (msg && e && e.message) {
          msg.textContent = 'Erro ao carregar: ' + String(e.message).slice(0, 160);
        }
      });
    </script>
