    <div id="root">
      <!-- Minimal shell — invisível por padrão, só aparece se a recuperação for necessária -->
      <div id="app-shell" aria-hidden="true" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:hsl(210 20% 98%);padding:24px;text-align:center">
        <div id="app-shell-recovery" style="display:none;max-width:420px;font-family:'Inter',system-ui,sans-serif;color:hsl(215 40% 12%)">
          <h2 id="app-shell-recovery-title" style="font-size:18px;font-weight:700;margin:0 0 8px">Estamos restaurando o aplicativo</h2>
          <p id="app-shell-recovery-msg" style="font-size:14px;color:hsl(215 20% 40%);margin:0 0 16px">A recuperação é automática e acontece internamente.</p>
          <div id="app-shell-actions" style="display:none;justify-content:center;flex-wrap:wrap">
            <a href="/ajuda" style="display:inline-flex;align-items:center;justify-content:center;background:hsl(25 95% 53%);color:hsl(0 0% 100%);text-decoration:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px">Acionar suporte</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function(){
        var AUTO_HEAL_KEY = '__bootstrap_autoheal_attempt_v2';
        var MAX_AUTO_HEAL_ATTEMPTS = 1;

        function shellOnly(){
          var root = document.getElementById('root');
          return !!root && root.children.length === 1 && root.firstElementChild && root.firstElementChild.id === 'app-shell';
        }

        function setAttempts(value){
          try {
            if (value <= 0) sessionStorage.removeItem(AUTO_HEAL_KEY);
            else sessionStorage.setItem(AUTO_HEAL_KEY, String(value));
          } catch(e) {}
        }

        function getAttempts(){
          try {
            return Number(sessionStorage.getItem(AUTO_HEAL_KEY) || '0') || 0;
          } catch(e) {
            return 0;
          }
        }

        function setRecoveryState(message, showSupport){
          var recovery = document.getElementById('app-shell-recovery');
          var title = document.getElementById('app-shell-recovery-title');
          var msg = document.getElementById('app-shell-recovery-msg');
          var actions = document.getElementById('app-shell-actions');
          if (recovery) recovery.style.display = 'block';
          if (title) title.textContent = showSupport ? 'Precisamos de ajuda para concluir a restauração' : 'Estamos restaurando o aplicativo';
          if (msg) msg.textContent = message;
          if (actions) actions.style.display = showSupport ? 'flex' : 'none';
        }

        async function clearRuntimeCaches(){
          try {
            if ('caches' in window) {
              var cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(function(name){ return caches.delete(name); }));
            }
          } catch(e) {}
          try {
            if ('serviceWorker' in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function(reg){ return reg.unregister(); }));
            }
          } catch(e) {}
        }

        async function autoHeal(reason){
          if (window.__appRecoveryInProgress || !shellOnly()) return;
          window.__appRecoveryInProgress = true;
          var attempts = getAttempts();

          if (attempts < MAX_AUTO_HEAL_ATTEMPTS) {
            setAttempts(attempts + 1);
            await clearRuntimeCaches();
            try {
              var url = new URL(location.href);
              url.searchParams.set('__fresh', Date.now());
              location.replace(url.toString());
            } catch (e) {
              location.reload();
            }
            return;
          }

          setRecoveryState('Estamos finalizando a restauração automática internamente.', false);
        }

        window.__appShellTimer = setTimeout(function(){
          if (window.__appMainLoaded) return;
          if (shellOnly()) autoHeal('timeout');
        }, 12000);

        window.addEventListener('error', function(e){
          var message = e && e.message ? String(e.message) : '';
          if (/schedulecallback|dynamically imported module|module script/i.test(message)) {
            autoHeal('error');
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e){
          var reason = e && 'reason' in e ? e.reason : '';
          var message = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
          if (/schedulecallback|dynamically imported module|module script/i.test(String(message))) {
            autoHeal('rejection');
          }
        });
      })();
    </script>
