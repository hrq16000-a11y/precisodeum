name: Security Prescan (pré-publicação)

# Roda ANTES de publicar: detecta achados bloqueantes de RLS/grants
# em vez de descobrí-los só quando o deploy falha.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-prescan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prescan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auditoria estática de grants nas migrations
        run: node scripts/audit-rpc-grants.mjs

      - name: Lint de payloads sensíveis (PII)
        run: node scripts/lint-sensitive-payloads.mjs

      - name: Pré-scan de segurança (RLS / policies / SECURITY DEFINER)
        run: node scripts/security-prescan.mjs
