name: Smoke After Deploy

# Smoke test pós-publicação rodando Playwright contra https://precisodeum.com.br.
# Gatilhos:
#   - workflow_dispatch:  rodar manualmente após cada publish
#   - schedule:           1x/dia às 09:00 UTC (06:00 BRT) como fallback
# Falhas abrem issue automaticamente com o anexo do report.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL alvo'
        required: false
        default: 'https://precisodeum.com.br'
  release:
    types: [published]
  schedule:
    - cron: '0 9 * * *'


permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-after-deploy
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://precisodeum.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        run: npx playwright test --grep "@smoke" --reporter=line,html
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Open issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Smoke after deploy FAILED — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `Smoke run \`${context.runId}\` falhou contra **${process.env.BASE_URL}**.`,
              '',
              `Report: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Cenários cobertos pela tag `@smoke`:',
              '- Login (email/senha + Google OAuth UI)',
              '- Busca pública por categoria/cidade',
              '- Perfil de prestador renderiza com `data-seo-ready="true"`',
              '- Contato/WhatsApp emite event tracking',
              '- Página de planos (Sponsor) carrega sem erro',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['smoke-failure', 'production'],
            });

      - name: Fail job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
