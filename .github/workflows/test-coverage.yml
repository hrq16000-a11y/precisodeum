name: Tests & Coverage

# Roda a suíte Vitest com cobertura em PRs e na main, publica o relatório
# no Codecov (se CODECOV_TOKEN estiver configurado) e sempre anexa o lcov
# como artifact para inspeção manual.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "vitest.config.ts"
      - "package.json"
      - ".github/workflows/test-coverage.yml"

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
