name: Performance CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/performance-ci.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Build de produção + Lighthouse + summary.
      # `ci:performance` já encadeia: build → check:performance → lighthouse:ci → lighthouse-summary → performance-regression.
      - name: Run performance pipeline (build + Lighthouse + gates)
        id: perf
        run: npm run ci:performance
        continue-on-error: true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-artifacts-${{ github.run_id }}
          path: |
            dist/lighthouse-report*.json
            dist/lighthouse-summary.md
            dist/lighthouse-summary.json
            dist/bundle-report.json
            dist/assets

      - name: Comment Lighthouse summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/lighthouse-summary.md';
            if (!fs.existsSync(path)) {
              core.warning('lighthouse-summary.md ausente — pulando comentário.');
              return;
            }
            let body = fs.readFileSync(path, 'utf8');
            // Limita a 60k chars para não estourar o limite de 65k do GitHub.
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n_… truncado, veja artifact `performance-artifacts`._';
            const marker = '<!-- lighthouse-perf-summary -->';
            const header = `${marker}\n### ⚡ Lighthouse summary (run ${context.runId})\n\n`;
            const fullBody = header + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Fail job if performance gates failed
        if: steps.perf.outcome == 'failure'
        run: |
          echo "::error::Lighthouse / performance regression gate falhou. Veja o comentário do PR e dist/lighthouse-summary.md."
          exit 1
