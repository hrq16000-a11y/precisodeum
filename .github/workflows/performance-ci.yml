name: Performance CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/performance-ci.yml"

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-artifacts
          path: |
            dist/lighthouse-report.json
            dist/bundle-report.json
            dist/assets