name: Onboarding Timers Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/components/onboarding/**"
      - "src/components/dashboard/DashboardTour.tsx"
      - "src/pages/CadastroInicialPage.tsx"
      - "src/pages/OnboardingV2SuccessPage.tsx"
      - "src/lib/wizardZombieGuard.ts"
      - "scripts/lint-onboarding-timers.mjs"
      - ".github/workflows/onboarding-timers-lint.yml"
  push:
    branches: [ "main" ]
    paths:
      - "src/components/onboarding/**"
      - "src/components/dashboard/DashboardTour.tsx"
      - "src/pages/CadastroInicialPage.tsx"
      - "src/pages/OnboardingV2SuccessPage.tsx"
      - "src/lib/wizardZombieGuard.ts"
      - "scripts/lint-onboarding-timers.mjs"

jobs:
  onboarding-timers:
    name: Forbid uncleaned timers/listeners in onboarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run onboarding timers guardrail
        run: node scripts/lint-onboarding-timers.mjs
