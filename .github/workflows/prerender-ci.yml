name: Prerender CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prerender.mjs'
      - 'scripts/generate-prerender-routes.mjs'
      - 'scripts/validate-prerender.mjs'
      - 'src/components/SeoMeta.tsx'
      - 'src/pages/CategoryPage.tsx'
      - 'src/pages/CityPage.tsx'
      - 'src/pages/ProviderProfile.tsx'
      - '.github/workflows/prerender-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prerender.mjs'
      - 'scripts/generate-prerender-routes.mjs'

permissions:
  contents: read
  pull-requests: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CHROMIUM_PATH: /usr/bin/chromium-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium path
        run: |
          CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")
          echo "CHROMIUM_PATH=$CHROMIUM" >> $GITHUB_ENV

      - name: Build + prerender (captura log completo)
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee prerender-output.txt
        continue-on-error: true

      - name: Resumo de falhas por rota SEO
        if: always()
        run: |
          echo "=== Resumo prerender ===" | tee prerender-summary.txt
          if [ -f prerender-output.txt ]; then
            TOTAL=$(grep -c "  ✓ " prerender-output.txt || true)
            FAIL=$(grep -c "  ✗ " prerender-output.txt || true)
            echo "✓ sucesso: $TOTAL" | tee -a prerender-summary.txt
            echo "✗ falhas:  $FAIL"  | tee -a prerender-summary.txt
            echo "" | tee -a prerender-summary.txt
            echo "--- Falhas por rota ---" | tee -a prerender-summary.txt
            grep "  ✗ " prerender-output.txt | tee -a prerender-summary.txt || echo "(nenhuma)" | tee -a prerender-summary.txt
          else
            echo "prerender-output.txt ausente — build falhou antes do prerender" | tee -a prerender-summary.txt
          fi

      - name: Validar metadata das rotas SEO
        if: always()
        run: node scripts/validate-prerender.mjs
        continue-on-error: true

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-${{ github.run_id }}
          path: |
            prerender-output.txt
            prerender-summary.txt
            dist/prerender-validation.json
            dist/**/index.html
          retention-days: 7

      - name: Falhar job se o build quebrou
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build/prerender falhou. Veja prerender-output.txt no artefato."
          exit 1
