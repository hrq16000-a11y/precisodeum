name: Security Lints

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/lint-tax-id-access.mjs"
      - "scripts/lint-sensitive-payloads.mjs"
      - "scripts/audit-rpc-grants.mjs"
      - "scripts/rpc-grants-baseline.json"
      - "scripts/rpc-grants-allowlist.json"
      - ".github/workflows/security-lints.yml"

jobs:
  tax-id-access:
    name: Forbid direct tax_id reads outside secure RPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tax_id access guardrail
        run: node scripts/lint-tax-id-access.mjs

  sensitive-payloads:
    name: Forbid sensitive payloads (CPF/CNPJ/email/phone/whatsapp) outside allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sensitive-payloads guardrail
        run: node scripts/lint-sensitive-payloads.mjs

  rpc-grants-diff:
    name: RPC grants diff (fail on new anon/public exposure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit RPC grants vs baseline
        run: node scripts/audit-rpc-grants.mjs
      - name: Upload grants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-grants-report
          path: .rpc-grants-report.json
          if-no-files-found: ignore


  tracking-anon-grants:
    name: Tracking RPCs must stay callable as anon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test anon EXECUTE on tracking RPCs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Segredos do backend ausentes — pulando smoke test de permissões."
            exit 0
          fi
          node scripts/verify-anon-tracking-grants.mjs

  tracking-observability-unit:
    name: Tracking observability unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Run tracking observability tests
        run: npx vitest run src/test/tracking-observability.test.ts
